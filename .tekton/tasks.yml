apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-workspace
      image: alpine:3.20
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        rm -rf "${WORKSPACE_SOURCE_PATH:?}/"* "${WORKSPACE_SOURCE_PATH:?}/".[!.]* "${WORKSPACE_SOURCE_PATH:?}/"..?*

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: Run unit tests with nose
      image: python:3.9
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install -r requirements.txt
        nosetests -v
